<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22262e">
  <title>QuizParty</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuizParty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <!-- Habillage du salon : supprimer la ligne suivante pour revenir à l'ancien graphisme -->
  <link rel="stylesheet" href="/theme.css">
  <!-- Habillage « Plateau TV » (clair/sombre) : supprimer la ligne suivante pour revenir au précédent -->
  <link rel="stylesheet" href="/plateau.css">
  <!-- Mode télé côté téléphone (manette, bouton « Afficher sur la télé ») -->
  <link rel="stylesheet" href="/manette.css">
  <script>try { if (JSON.parse(localStorage.getItem('quizparty:theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
</head>
<body>
  <div id="conn" class="conn-banner" hidden>Connexion perdue — reconnexion…</div>
  <div id="app"></div>
  <div id="propose" class="propose-panel" hidden>
    <div class="propose-sheet" role="dialog" aria-modal="true" aria-label="Proposer du contenu">
      <div class="propose-head">
        <b>💡 Proposer</b>
        <button id="propose-close" class="btn small ghost" type="button">✕ Fermer</button>
      </div>
      <button id="propose-live" class="propose-live" type="button" hidden></button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
