<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22262e">
  <title>Proposer · QuizParty</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/proposer.css">
  <!-- Habillage « Plateau TV » (clair/sombre) : supprimer la ligne suivante pour revenir au précédent -->
  <link rel="stylesheet" href="/plateau.css">
  <script>try { if (JSON.parse(localStorage.getItem('quizparty:theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
</head>
<body>
  <main class="screen submit">
    <div class="top"><a class="link" href="/">← Retour au jeu</a></div>
    <h1 class="submit-title">Proposer du contenu</h1>
    <p class="muted submit-intro">Une question, un pitch, une capture, un son… Chaque proposition est vérifiée avant d’arriver en jeu.</p>
    <form id="form" class="card submit-form" novalidate>
      <div class="field"><span>1. Pour quel mode ?</span><div id="modes" class="modes"></div></div>
      <div id="fields" hidden></div>
      <p id="error" class="submit-error" role="alert" hidden></p>
      <button id="send" class="btn primary big" type="submit" hidden>Envoyer</button>
    </form>
    <div id="done" class="card submit-done" hidden>
      <p class="big-check">✓</p>
      <p><b>Merci !</b> Ta proposition est bien arrivée. Elle sera vérifiée avant d’apparaître en jeu.</p>
      <button class="btn primary" id="again" type="button">Proposer autre chose</button>
      <button class="btn" id="back" type="button" hidden>Retour au jeu</button>
    </div>
    <datalist id="games"></datalist>
  </main>
  <script src="/proposer.js"></script>
</body>
</html>
