# SECOURS de l'anti-veille (Supabase appelle /health toutes les 10 min, migration 2026-11-28-reveil-render.sql).
# À supprimer avec elle si le serveur Render passe en payant.
#
# Réveil du serveur avant chaque quiz en direct (Render gratuit s'endort après 15 min sans visite).
# La notification des abonnés part à l'ouverture de la salle d'attente, 5 min avant le départ : le serveur
# doit donc être debout à ce moment-là. GitHub lance ces tâches en heure UTC, souvent avec du retard : chaque
# direct a deux réveils, environ 45 et 22 min avant le départ, et chacun en heure d'hiver (UTC+1) et d'été
# (UTC+2). Une fois réveillé, le serveur se garde éveillé jusqu'à la fin du direct (Live.keepAwake dans
# server/live.js). Si les deux ont plus de 17 min de retard, la notification part en retard ou saute.
# Coût : environ 350 minutes d'Actions par mois (2 000 gratuites pour un dépôt privé).
name: Réveil avant le direct
on:
  schedule:
    - cron: '3,23 10,11 * * *'     # 12 h 45 tous les jours
    - cron: '47 15,16 * * 1-6'     # 18 h 30, du lundi au samedi (premier réveil)
    - cron: '8 16,17 * * 1-6'      # 18 h 30, du lundi au samedi (second réveil)
    - cron: '17,38 19,20 * * 1-6'  # 22 h, du lundi au samedi
    - cron: '17,38 18,19 * * 0'    # 21 h le dimanche (finale)
  workflow_dispatch:
permissions: {}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Réveiller le serveur
        env:
          SITE_URL: ${{ vars.APP_URL || 'https://quizparty-3g8q.onrender.com' }}
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 "$SITE_URL/health" && exit 0
            sleep 20
          done
          exit 1
